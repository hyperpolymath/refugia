# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project
#
# Security note: Keep github-actions ecosystem enabled to receive
# security updates for all workflow dependencies.

version: 2

multi-ecosystem-groups:
  js-locks:
    schedule:
      interval: "daily"
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"

  # Rust/Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Elixir/Mix
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "daily"

  # Node.js/npm
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]

  # Bun (bun.lock): in the js-locks group with npm, so one PR moves package.json and bun.lock together
  - package-ecosystem: "bun"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]

  # Python/pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

  # Nix flakes
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "daily"
